services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secondsource
      POSTGRES_PASSWORD: secondsource
      POSTGRES_DB: secondsource
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondsource"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
